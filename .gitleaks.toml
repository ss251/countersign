# gitleaks configuration for this repository: the default rules, plus an allowlist of exact
# public values that are not secrets.
[extend]
useDefault = true

[allowlist]
description = "Public contract addresses (not secrets)"
regexes = [
  # Tether USD on Whitechain Sepolia, chain 1874
  '''0xcedfB56113143d55b2358b8CFbB0dEB5Ad2f55a7''',
  # anvil's published development keys #0-#4 (test fixtures only; they hold nothing anywhere)
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
  '''47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a''',
]
# Prose in a worker report that the generic-api-key rule misreads as a key:
# ".packets/reports/cs-15-eip3009.md" line 11 describes extra: {name: tokenName, version: tokenVersion}.
paths = [
  '''^\.packets/reports/cs-15-eip3009\.md$''',
]
