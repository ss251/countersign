# gitleaks configuration for this repository: the default rules, plus an allowlist of exact
# public values that are not secrets. Each address is one exact string, matched in any letter
# case because the code writes both checksummed and lowercase forms. No broad pattern, no path.
[extend]
useDefault = true

[allowlist]
description = "Public contract and account addresses (not secrets)"
regexes = [
  # Arc testnet (5042002)
  '''(?i)0x3600000000000000000000000000000000000000''', # USDC
  '''(?i)0x19c27d770969291e6a0a305dc1be1a845e7c1b76''', # CountersignedEscrow v1 (Arc Studio)
  '''(?i)0x44d11b8909485e3f575F6628b689383E4420f54a''', # CountersignedEscrow v1 (forge)
  '''(?i)0x10A3c07cc6A519C0106e315D2C42010eCbEFF3CE''', # CountersignedEscrow v2
  '''(?i)0xbf9de410d4a17781df0d9d3dd160018aceb3fe87''', # FeeSplit, the escrow treasury (Studio v1 and v2)
  '''(?i)0x69831d0AAD960e88b62983F3568A1E67d40581b1''', # FeeSplit (forge v1)
  '''(?i)0xE37F64A73225f5eA06BABcb1cc5440F01446C267''', # the hub submitter, Arc v2 arbiter
