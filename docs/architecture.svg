<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="t d">
  <title id="t">countersign architecture</title>
  <desc id="d">A human sets an envelope on the phone. The buyer agent finds an offer on the hub, gets a 402 with the price, and countersigns the offer hash and amount. The hub settles through a rail, sends the job to the seller's runner, which dials out from the seller's machine and signs a release over the slip hash. The buyer keeps the slip, and anyone can verify it against the chain without the hub.</desc>
  <style>
    .paper { fill: #f3f0e9; }
    .box { fill: #faf8f3; stroke: #dad5c9; stroke-width: 1; }
    .box-ink { fill: #faf8f3; stroke: #17170f; stroke-width: 1.25; }
    .t { font: 600 17px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #17170f; }
    .s { font: 400 13.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6a675c; }
    .k { font: 500 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #17170f; }
    .m { font: 400 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #17170f; }
    .eyebrow { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6a675c; letter-spacing: 0.04em; }
    .line { fill: none; stroke: #17170f; stroke-width: 1.4; }
    .seal { fill: none; stroke: #a8341c; stroke-width: 1.8; }
    .money { fill: none; stroke: #1b4f8f; stroke-width: 1.8; }
    .settle { fill: none; stroke: #1d6b45; stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 5; }
    .seal-t { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #a8341c; }
    .money-t { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1b4f8f; }
    .settle-t { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1d6b45; }
    .zone { fill: none; stroke: #dad5c9; stroke-width: 1; stroke-dasharray: 3 4; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#17170f"/></marker>
    <marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8341c"/></marker>
    <marker id="a-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b4f8f"/></marker>
    <marker id="a-settle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d6b45"/></marker>
  </defs>

  <rect class="paper" x="0" y="0" width="1280" height="860"/>

