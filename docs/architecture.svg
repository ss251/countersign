  <text class="t" x="76" y="56" style="font: 500 19px ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: -0.02em">countersign</text>
  <text class="s" x="210" y="56">One countersignature per purchase. Escrow until the output checks out. A slip anyone can verify.</text>

  <!-- Zones -->
  <rect class="zone" x="24" y="96" width="320" height="420" rx="14"/>
  <text class="eyebrow" x="40" y="118">BUYER'S DEVICES</text>
  <rect class="zone" x="936" y="232" width="320" height="284" rx="14"/>
  <text class="eyebrow" x="952" y="254">SELLER'S MACHINE</text>

  <!-- Human -->
  <rect class="box" x="40" y="134" width="288" height="118" rx="10"/>
  <text class="t" x="58" y="164">The human, on a phone</text>
  <text class="s" x="58" y="188">Envelope: budget, per-seller limit,</text>
  <text class="s" x="58" y="207">allowlist, revoke</text>
  <text class="s" x="58" y="230">Holds to countersign above the limit</text>

  <!-- Buyer agent -->
  <rect class="box-ink" x="40" y="318" width="288" height="182" rx="10"/>
  <text class="t" x="58" y="348">Buyer agent</text>
  <text class="s" x="58" y="372">Finds offers, checks the envelope</text>
  <text class="s" x="58" y="391">and its pinned rail table</text>
  <text class="s" x="58" y="414">Key stays on the device</text>
  <text class="s" x="58" y="437">Keeps every slip in its journal</text>
  <text class="m" x="58" y="470">countersign(offerHash, amount)</text>

  <!-- Hub -->
  <rect class="box-ink" x="496" y="252" width="288" height="264" rx="10"/>
  <text class="t" x="514" y="282">Hub</text>
  <text class="s" x="514" y="306">Registry, plus discovery: A2A card,</text>
  <text class="s" x="514" y="325">skills index, OpenAPI</text>
  <text class="s" x="514" y="350">x402 challenge: 402 with the price</text>
  <text class="s" x="514" y="375">Input gate before payment,</text>
  <text class="s" x="514" y="394">output gate before release</text>
  <text class="s" x="514" y="419">Verifies, settles, releases</text>
  <text class="s" x="514" y="444">Holds no buyer key</text>
  <text class="m" x="514" y="478">POST /offers/:hash/call</text>
  <text class="m" x="514" y="498">GET  /slips/:hash</text>

  <!-- Runner -->
  <rect class="box-ink" x="952" y="270" width="288" height="230" rx="10"/>
  <text class="t" x="970" y="300">Seller runner</text>
  <text class="s" x="970" y="324">Dials out to the hub; opens no port</text>
  <text class="s" x="970" y="347">Signs its offers</text>
  <text class="s" x="970" y="370">Runs the call: skill, MCP or OpenAPI</text>
  <text class="s" x="970" y="393">Code, prompts and keys stay here</text>
  <text class="s" x="970" y="416">Signs the release over the slip</text>
  <text class="m" x="970" y="452">Release(jobId, slipHash)</text>

  <!-- Human -> buyer agent -->
  <path class="line" d="M184 252 V 314" marker-end="url(#a-ink)"/>
  <text class="k" x="196" y="288">limits, and the hold</text>

  <!-- Buyer agent <-> hub -->
  <path class="line" d="M328 352 H 492" marker-end="url(#a-ink)"/>
  <text class="k" x="340" y="342">GET /offers · call</text>
  <path class="seal" d="M328 398 H 492" marker-end="url(#a-seal)"/>
  <text class="seal-t" x="340" y="390">countersignature</text>
  <path class="line dash" d="M492 452 H 332" marker-end="url(#a-ink)"/>
  <text class="k" x="346" y="444">output and slip</text>

  <!-- Hub <-> runner -->
  <path class="line" d="M948 320 H 788" marker-end="url(#a-ink)"/>
  <text class="k" x="800" y="310">dials out</text>
  <path class="line" d="M788 372 H 948" marker-end="url(#a-ink)"/>
  <text class="k" x="800" y="364">job</text>
  <path class="line" d="M948 424 H 788" marker-end="url(#a-ink)"/>
  <text class="k" x="800" y="416">output, signed release</text>

  <!-- Hub -> rails bus -->
  <path class="money" d="M640 516 V 572"/>
  <path class="money" d="M150 572 H 1130"/>
  <path class="money" d="M150 572 V 596" marker-end="url(#a-money)"/>
  <path class="money" d="M395 572 V 596" marker-end="url(#a-money)"/>
  <path class="money" d="M640 572 V 596" marker-end="url(#a-money)"/>
  <path class="money" d="M885 572 V 596" marker-end="url(#a-money)"/>
  <path class="money" d="M1130 572 V 596" marker-end="url(#a-money)"/>
  <text class="money-t" x="652" y="550">fund · release · refund</text>

  <!-- Rails -->
  <rect class="box" x="40" y="600" width="220" height="96" rx="10"/>
  <text class="t" x="56" y="628">Arc · escrow</text>
  <text class="s" x="56" y="651">CountersignedEscrow, USDC</text>
  <text class="s" x="56" y="672">Funded, Released, Refunded</text>

  <rect class="box" x="285" y="600" width="220" height="96" rx="10"/>
  <text class="t" x="301" y="628">Arc · Gateway</text>
  <text class="s" x="301" y="651">Circle Gateway nanopayments</text>
  <text class="s" x="301" y="672">Seller credited in a batch</text>

  <rect class="box" x="530" y="600" width="220" height="96" rx="10"/>
  <text class="t" x="546" y="628">Whitechain · USDT</text>
  <text class="s" x="546" y="651">The same escrow on chain 1874</text>
  <text class="s" x="546" y="672">Our relayer pays the gas</text>

  <rect class="box" x="775" y="600" width="220" height="96" rx="10"/>
  <text class="t" x="791" y="628">Hedera · x402</text>
  <text class="s" x="791" y="651">Facilitator, HTS USDC</text>
  <text class="s" x="791" y="672">Every spend on an HCS topic</text>

  <rect class="box" x="1020" y="600" width="220" height="96" rx="10"/>
  <text class="t" x="1036" y="628">Stripe · MPP</text>
  <text class="s" x="1036" y="651">Machine Payments Protocol</text>
  <text class="s" x="1036" y="672">The slip keeps the receipt id</text>

  <!-- Verifier -->
  <rect class="box-ink" x="40" y="752" width="700" height="80" rx="10"/>
  <text class="t" x="58" y="782">Verifier, with the hub gone</text>
  <text class="s" x="58" y="806">The slip's hash, both signatures, and the release read from the chain</text>
  <path class="line dash" d="M60 500 C 10 560, 10 700, 52 748" marker-end="url(#a-ink)"/>
  <text class="k" x="20" y="730" transform="rotate(-90 20 730)">slip.json</text>
  <path class="settle" d="M150 752 V 700" marker-end="url(#a-settle)"/>
  <path class="settle" d="M640 752 V 700" marker-end="url(#a-settle)"/>
  <text class="settle-t" x="168" y="721">reads Released(jobId, slipHash) from the escrow, on Arc or Whitechain</text>
  <text class="s" x="168" y="741">VALID only if the chain holds this slip's hash</text>
</svg>
